server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/response_handler
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  data:
    redis:
      port: 6379
      host: localhost
      timeout: 3000
  application:
    name: jwt-dome
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.freemarker.FreeMarkerAutoConfiguration

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.jwtdome.domain
  configuration: # 驼峰命名
    map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: auto


